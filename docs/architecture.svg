<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap');
    text { font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #161616; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-size: 12.5px; fill: #525252; }
    .n { font-size: 11px; font-weight: 600; fill: #0f62fe; letter-spacing: .06em; }
    .box { fill: #ffffff; stroke: #161616; stroke-width: 1.25; }
    .ext { fill: #f4f4f4; stroke: #8d8d8d; stroke-width: 1.25; }
    .ln { stroke: #393939; stroke-width: 1.25; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#393939"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f62fe"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>

  <!-- source -->
  <rect class="ext" x="20" y="170" width="170" height="96"/>
  <text class="h" x="36" y="200">UPI switch /</text>
  <text class="h" x="36" y="220">core banking</text>
  <text class="b" x="36" y="246">payment authorisation</text>

  <!-- LinuxONE boundary -->
  <rect x="230" y="30" width="720" height="400" fill="#f7f9ff" stroke="#0f62fe" stroke-width="1.25" stroke-dasharray="6 5"/>
  <text x="248" y="56" font-size="13" font-weight="600" fill="#0f62fe">IBM LinuxONE</text>
  <text class="b" x="352" y="56">Secure Execution guest · pervasive encryption · Crypto Express HSM</text>

  <!-- 1 -->
  <rect class="box" x="250" y="90" width="210" height="130"/>
  <text class="n" x="266" y="114">01  PRIVACY</text>
  <text class="h" x="266" y="138">Tokenisation</text>
  <text class="b" x="266" y="162">HMAC-SHA256 tokens replace</text>
  <text class="b" x="266" y="180">UPI IDs and device IDs</text>
  <text class="b" x="266" y="198">at ingestion</text>

  <!-- 2 -->
  <rect class="box" x="485" y="90" width="210" height="130"/>
  <text class="n" x="501" y="114">02  FEATURES</text>
  <text class="h" x="501" y="138">Streaming feature store</text>
  <text class="b" x="501" y="162">14 behavioural signals per</text>
  <text class="b" x="501" y="180">payer and receiver; shared</text>
  <text class="b" x="501" y="198">by training and serving</text>

  <!-- 3 -->
  <rect class="box" x="720" y="90" width="210" height="130"/>
  <text class="n" x="736" y="114">03  MODEL</text>
  <text class="h" x="736" y="138">Risk scoring</text>
  <text class="b" x="736" y="162">Gradient-boosted trees</text>
  <text class="b" x="736" y="180">+ isolation-forest novelty</text>
  <text class="b" x="736" y="198">detector</text>

  <!-- 4 -->
  <rect class="box" x="485" y="260" width="210" height="120"/>
  <text class="n" x="501" y="284">04  EXPLAIN</text>
  <text class="h" x="501" y="308">Reason codes</text>
  <text class="b" x="501" y="332">Occlusion attribution ranks</text>
  <text class="b" x="501" y="350">the signals behind the score</text>

  <!-- 5 -->
  <rect class="box" x="720" y="260" width="210" height="120"/>
  <text class="n" x="736" y="284">05  DECIDE</text>
  <text class="h" x="736" y="308">Decision policy</text>
  <text class="b" x="736" y="332">ALLOW · STEP-UP · HOLD</text>
  <text class="b" x="736" y="350">tuned for ≥90% hold precision</text>

  <text class="b" x="250" y="410">Median end-to-end decision time 13 ms (p99 27 ms) · stateless, horizontally scalable</text>

  <!-- consumers -->
  <rect class="ext" x="990" y="150" width="190" height="96"/>
  <text class="h" x="1006" y="180">Customer channel</text>
  <text class="b" x="1006" y="204">Scam-specific warning</text>
  <text class="b" x="1006" y="222">(English / Hindi), 1930</text>

  <rect class="ext" x="990" y="280" width="190" height="96"/>
  <text class="h" x="1006" y="310">Fraud operations</text>
  <text class="b" x="1006" y="334">Alerts with reasons,</text>
  <text class="b" x="1006" y="352">masked identifiers only</text>

  <!-- flow -->
  <path class="ln" d="M190 218 H220 V155 H247" marker-end="url(#a)"/>
  <path class="ln" d="M460 155 H482" marker-end="url(#a)"/>
  <path class="ln" d="M695 155 H717" marker-end="url(#a)"/>
  <path class="ln" d="M825 220 V257" marker-end="url(#a)"/>
  <path class="ln" d="M770 220 V240 H590 V257" marker-end="url(#a)"/>
  <path class="ln" d="M695 320 H717" marker-end="url(#a)"/>
  <path class="ln" d="M930 300 H960 V198 H987" marker-end="url(#a)"/>
  <path class="ln" d="M930 340 H987" marker-end="url(#a)"/>

  <!-- in-transaction return path -->
  <path d="M825 380 V470 H105 V269" stroke="#0f62fe" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <text x="125" y="492" font-size="12.5" font-weight="500" fill="#0f62fe">Decision returned within the authorisation call, before funds move</text>
</svg>
